name: Deploy - Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar arquivos do site
        run: |
          mkdir -p _site
          cp -r index.html style.css img _site/ 2>/dev/null || true
          tar -cvf artifact.tar -C _site .

      - name: Enviar artifact para o Pages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: artifact.tar

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_id: ${{ steps.upload.outputs.artifact-id }}
